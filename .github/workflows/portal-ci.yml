name: Portal CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check src/api.js && node --check src/main.js
      - name: Validate portal compose overlay syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          doc = yaml.safe_load(Path('docker-compose.portal.yml').read_text())
          portal = doc['services']['payroll-portal-client']
          assert portal['build']['context'] == '.'
          assert '4173:80' in portal['ports']
          assert 'payroll-net' in portal['networks']
          PY
      - name: Build portal image
        run: docker build -t payroll-portal-client:ci .
